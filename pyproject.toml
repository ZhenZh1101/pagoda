[project]
name = "pagoda"
version = "0.1.0"
description = "Pagoda v0.1: ~100M English LM trained from scratch on Apple Silicon with MLX"
requires-python = ">=3.11,<3.13"
dependencies = [
    "mlx>=0.29",
    "numpy>=1.26",
    "pyarrow>=16",
    "huggingface-hub>=0.34",
    "rustbpe>=0.1.0",
    "tiktoken>=0.9",
    "regex>=2024.0",
    "zstandard>=0.22",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
