<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagoda Chat</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --text: #1c1c1e; --muted: #75757a; --border: #e2e0db;
  --accent: #a8502b; --accent-text: #ffffff; --user: #ebe7df; --code: #f0eee9; --out: #eaf1ea; --error: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151515; --panel: #1e1e1e; --text: #ececec; --muted: #9b9b9b; --border: #343434;
    --accent: #e0805a; --accent-text: #1a1a1a; --user: #2b2925; --code: #252523; --out: #1d2920; --error: #f2b8b5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
}
select, input, textarea, button { font: inherit; color: inherit; }
select, input[type=number] {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; max-width: 100%;
}
button {
  background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 5px 12px; cursor: pointer;
}
button:hover { background: var(--bg); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
button:disabled { opacity: .5; cursor: default; }

header {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; font-weight: 600; margin: 0 6px 0 0; }
#model { min-width: 0; flex: 0 1 300px; }
.spacer { flex: 1; }

#settings {
  display: none; gap: 10px 18px; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
#settings.open { display: grid; }
#settings label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
#settings .wide { grid-column: 1 / -1; }
#settings textarea {
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px;
  resize: vertical; min-height: 60px; color: var(--text);
}
#settings textarea:disabled { opacity: .5; }

main { flex: 1; overflow-y: auto; }
#log { max-width: 780px; margin: 0 auto; padding: 20px 16px 8px; }
.empty { color: var(--muted); text-align: center; margin-top: 16vh; }
.msg { margin: 0 0 20px; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble {
  background: var(--user); border-radius: 14px; padding: 8px 14px; max-width: 85%;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.msg.assistant .tag { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.text { white-space: pre-wrap; overflow-wrap: anywhere; }
.prompt { color: var(--muted); }
.block { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; overflow: hidden; }
.block.code { background: var(--code); }
.block.out { background: var(--out); }
.block .label { font-size: 12px; color: var(--muted); padding: 2px 10px; border-bottom: 1px solid var(--border); }
.block pre {
  margin: 0; padding: 8px 10px; overflow-x: auto; white-space: pre;
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.error { color: var(--error); white-space: pre-wrap; }
.live > :last-child::after { content: "▍"; color: var(--muted); }

footer { padding: 8px 16px 14px; }
.composer {
  max-width: 780px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 8px;
}
.composer textarea {
  flex: 1; border: 0; outline: 0; resize: none; background: transparent; padding: 4px 6px; max-height: 200px;
}
.hint { max-width: 780px; margin: 4px auto 0; font-size: 12px; color: var(--muted); padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>Pagoda Chat</h1>
  <select id="model" title="模型"></select>
  <select id="mode" title="模式">
    <option value="chat">对话</option>
    <option value="complete">续写</option>
  </select>
  <span class="spacer"></span>
  <button id="toggle-settings" type="button">参数</button>
  <button id="clear" type="button">清空</button>
</header>

<section id="settings">
  <label>temperature <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.7"></label>
  <label>top_p <input id="top_p" type="number" min="0.05" max="1" step="0.05" value="0.9"></label>
  <label>最多生成 token <input id="max_tokens" type="number" min="1" max="1024" step="16" value="512"></label>
  <label class="wide">系统提示（仅对话模式；留空则不用）<textarea id="system"></textarea></label>
</section>

<main id="scroller"><div id="log"><p class="empty" id="empty">选择模型，然后开始对话。对话只保存在这个页面里，刷新即清空。</p></div></main>

<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send" class="primary" type="button">发送</button>
  </div>
  <div class="hint" id="hint"></div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let models = [];
let history = [];   // chat-mode turns sent to the server: {role, content}
let ctrl = null;    // AbortController of the reply being generated

function current() { return models.find((m) => m.id === $('model').value); }

async function init() {
  try {
    const data = await (await fetch('/api/models')).json();
    models = data.models;
    $('system').value = data.system_prompt || '';
  } catch (e) {
    $('hint').textContent = '无法连接服务器：' + e;
    return;
  }
  if (!models.length) {
    $('hint').textContent = 'ckpt/ 下没有找到模型';
    $('send').disabled = true;
    return;
  }
  const groups = {};
  for (const m of models) {
    if (!groups[m.run]) {
      groups[m.run] = document.createElement('optgroup');
      groups[m.run].label = m.run;
      $('model').appendChild(groups[m.run]);
    }
    const opt = new Option(m.label, m.id);
    groups[m.run].appendChild(opt);
  }
  onModelChange();
}

function onModelChange() {
  const m = current();
  $('mode').value = m && m.kind === 'base' ? 'complete' : 'chat';
  onModeChange();
}

function onModeChange() {
  const chat = $('mode').value === 'chat';
  $('system').disabled = !chat;
  $('input').placeholder = chat ? '输入消息，Enter 发送，Shift+Enter 换行' : '输入开头，模型接着往下写（不带上下文）';
  const m = current();
  $('hint').textContent = m && m.kind === 'base' && chat ? 'base 模型没有做过对话微调，建议用「续写」模式' : '';
}

function scrollDown(force) {
  const s = $('scroller');
  if (force || s.scrollHeight - s.scrollTop - s.clientHeight < 120) s.scrollTop = s.scrollHeight;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function addUser(text) {
  $('empty')?.remove();
  const row = el('div', 'msg user');
  row.appendChild(el('div', 'bubble', text));
  $('log').appendChild(row);
  scrollDown(true);
}

// One assistant reply: text runs, python blocks and their outputs, in order.
function addAssistant(label, prompt) {
  const row = el('div', 'msg assistant');
  row.appendChild(el('div', 'tag', label));
  const body = el('div', 'live');
  row.appendChild(body);
  $('log').appendChild(row);
  if (prompt !== undefined) {
    const t = el('div', 'text');
    t.appendChild(el('span', 'prompt', prompt));
    body.appendChild(t);
  }
  let status = null;
  const clearStatus = () => { status?.remove(); status = null; };
  return {
    add(kind, text) {
      clearStatus();
      let last = body.lastElementChild;
      if (kind === 'text') {
        if (!last || !last.classList.contains('text')) body.appendChild(last = el('div', 'text'));
        last.appendChild(document.createTextNode(text));
      } else if (kind === 'code') {
        if (!last || !last.classList.contains('code')) {
          last = el('div', 'block code');
          last.appendChild(el('div', 'label', 'python'));
          last.appendChild(el('pre'));
          body.appendChild(last);
        }
        last.querySelector('pre').appendChild(document.createTextNode(text));
      } else if (kind === 'output') {
        last = el('div', 'block out');
        last.appendChild(el('div', 'label', '运行结果'));
        last.appendChild(el('pre', '', text));
        body.appendChild(last);
      }
      scrollDown();
    },
    status(text) { clearStatus(); status = el('div', 'meta', text); row.appendChild(status); },
    meta(text) { clearStatus(); row.appendChild(el('div', 'meta', text)); },
    error(text) { clearStatus(); row.appendChild(el('div', 'error', text)); },
    end() { clearStatus(); body.classList.remove('live'); scrollDown(); },
  };
}

function setBusy(on) {
  $('send').textContent = on ? '停止' : '发送';
  $('model').disabled = on;
  $('mode').disabled = on;
}

async function send() {
  if (ctrl) { ctrl.abort(); return; }
  const text = $('input').value;
  const m = current();
  if (!text.trim() || !m) return;
  const mode = $('mode').value;
  $('input').value = '';
  autosize();

  const req = {
    model: m.id, mode,
    temperature: parseFloat($('temperature').value),
    top_p: parseFloat($('top_p').value),
    max_tokens: parseInt($('max_tokens').value, 10),
  };
  let view;
  if (mode === 'chat') {
    addUser(text);
    history.push({ role: 'user', content: text });
    req.messages = history;
    req.system = $('system').value;
    view = addAssistant(`${m.run} / ${m.label}`);
  } else {
    $('empty')?.remove();
    req.prompt = text;
    view = addAssistant(`${m.run} / ${m.label} · 续写`, text);
  }

  const hist = history;  // "清空" mid-reply swaps in a new array; this reply must not land in it
  const parts = [];   // the reply as tokenizer content parts, for the next chat turn
  const push = (type, t) => {
    const last = parts[parts.length - 1];
    if (type !== 'python_output' && last && last.type === type) last.text += t;
    else parts.push({ type, text: t });
  };
  let failed = false;
  ctrl = new AbortController();
  setBusy(true);
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(req), signal: ctrl.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'text') { view.add('text', ev.text); push('text', ev.text); }
        else if (ev.type === 'code') { view.add('code', ev.text); push('python', ev.text); }
        else if (ev.type === 'output') { view.add('output', ev.text); push('python_output', ev.text); }
        else if (ev.type === 'status') view.status(ev.text);
        else if (ev.type === 'error') { view.error(ev.text); failed = true; }
        else if (ev.type === 'done') {
          let s = `${ev.tokens} tokens · ${ev.tok_per_s} tok/s · 上下文 ${ev.context}/${ev.seq_len}`;
          if (ev.turns) s += ` · 带上最近 ${ev.turns} 轮`;
          if (!ev.finished) s += ' · 到达长度上限';
          view.meta(s);
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') view.meta('已停止');
    else { view.error(String(e)); failed = true; }
  } finally {
    view.end();
    if (mode === 'chat') {
      if (failed && !parts.length) hist.pop();
      else hist.push({ role: 'assistant', content: parts });
    }
    ctrl = null;
    setBusy(false);
    $('input').focus();
  }
}

function autosize() {
  const t = $('input');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 200) + 'px';
}

$('model').addEventListener('change', onModelChange);
$('mode').addEventListener('change', onModeChange);
$('send').addEventListener('click', send);
$('toggle-settings').addEventListener('click', () => $('settings').classList.toggle('open'));
$('clear').addEventListener('click', () => {
  ctrl?.abort();
  history = [];
  $('log').replaceChildren(el('p', 'empty', '对话已清空。'));
  $('log').firstChild.id = 'empty';
});
$('input').addEventListener('input', autosize);
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!ctrl) send(); }
});
init();
</script>
</body>
</html>
